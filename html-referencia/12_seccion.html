<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Tareas Artísticas</title>

    <link
        rel="stylesheet"
        href="12_seccion.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

<div class="telefono">


    <!-- =========================
         ENCABEZADO
    ========================== -->

    <header class="header">

        <!-- VOLVER -->

        <a
            class="boton"
            href="11_seccion.html"
            title="Volver">

            <i class="fa-solid fa-arrow-left"></i>

        </a>


        <!-- TÍTULO -->

        <h1>
            Tareas Artísticas
        </h1>


        <!-- INICIO -->

        <a
            class="boton"
            href="5_seccion.html"
            title="Inicio">

            <i class="fa-solid fa-house"></i>

        </a>

    </header>


    <!-- =========================
         CONTENIDO
    ========================== -->

    <main class="contenido">

        <h2>
            Tus tareas
        </h2>


        <div class="lista">


            <!-- TAREA 1 -->

            <div class="tarea">

                <span>
                    Colorear dibujo
                </span>

                <button
                    class="estado verde"
                    title="Tarea completada">

                    <i class="fa-solid fa-check"></i>

                </button>

            </div>


            <!-- TAREA 2 -->

            <div class="tarea">

                <span>
                    Delineado
                </span>

                <button
                    class="estado verde"
                    title="Tarea completada">

                    <i class="fa-solid fa-check"></i>

                </button>

            </div>


            <!-- TAREA 3 -->

            <div class="tarea">

                <span>
                    Sombras
                </span>

                <button
                    class="estado rojo"
                    title="Tarea no entregada">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>


            <!-- TAREA 4 -->

            <div class="tarea">

                <span>
                    Paisaje
                </span>

                <a
                    class="estado pendiente"
                    href="14_seccion.html"
                    title="Ver tarea">

                    <i class="fa-regular fa-square"></i>

                </a>

            </div>


            <!-- TAREA 5 -->

            <div class="tarea">

                <span>
                    Biografía
                </span>

                <button
                    class="estado verde"
                    title="Tarea completada">

                    <i class="fa-solid fa-check"></i>

                </button>

            </div>


        </div>


        <!-- =========================
             AGREGAR NUEVA TAREA
        ========================== -->

        <a
            class="agregar"
            href="17_seccion.html"
            title="Agregar nueva tarea">

            <i class="fa-solid fa-plus"></i>

        </a>


    </main>

</div>


</body>

</html>
