<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calificar - Sebastián Gómez</title>

    <link rel="stylesheet" href="119_seccion.css">
</head>

<body>

<div class="telefono">

    <header>
        <a href="118_seccion.html" class="boton-volver">←</a>
        <h1>Calificar actividad</h1>
    </header>

    <div class="perfil">
        <div class="avatar">👨‍🎨</div>

        <div>
            <h2>Sebastián Gómez</h2>
            <p>10° · Artística</p>
        </div>
    </div>

    <main class="contenido">

        <div class="actividad">

            <h2>Actividad 2</h2>

            <h3>Proyecto artístico</h3>

            <p class="descripcion">
                Revisión del proyecto artístico realizado por el estudiante.
            </p>

            <div class="archivo">
                📎 Proyecto_artistico.pdf
            </div>

        </div>

        <form id="formulario">

            <label for="nota">
                Calificación
            </label>

            <input
                type="number"
                id="nota"
                min="0"
                max="5"
                step="0.1"
                placeholder="Ejemplo: 4.5"
                required
            >

            <label for="comentario">
                Comentario
            </label>

            <textarea
                id="comentario"
                rows="5"
                placeholder="Escribe un comentario sobre el trabajo..."
                required
            ></textarea>

            <button type="submit">
                Guardar calificación
            </button>

        </form>

        <div id="mensajeExito" class="mensaje-exito">
            ✓ Calificación guardada correctamente.
        </div>

    </main>

</div>

<script>

document.getElementById("formulario").addEventListener("submit", function(event) {

    event.preventDefault();

    const nota = parseFloat(document.getElementById("nota").value);
    const comentario = document.getElementById("comentario").value.trim();

    if (nota < 0 || nota > 5) {
        alert("La calificación debe estar entre 0 y 5.");
        return;
    }

    if (comentario === "") {
        alert("Debes escribir un comentario.");
        return;
    }

    localStorage.setItem(
        "calificacion_sebastian_actividad2",
        nota
    );

    localStorage.setItem(
        "comentario_sebastian_actividad2",
        comentario
    );

    document.getElementById("mensajeExito").style.display = "block";

    setTimeout(function() {
        window.location.href = "118_seccion.html";
    }, 1000);

});

</script>

</body>

</html>
