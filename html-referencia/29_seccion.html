<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tareas de Química</title>

    <link rel="stylesheet" href="29_seccion.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="telefono">

    <!-- ENCABEZADO -->
    <header class="header">

        <a class="boton" href="28_seccion.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Tareas de Química</h1>

        <a class="boton" href="5_seccion.html">
            <i class="fa-solid fa-house"></i>
        </a>

    </header>


    <!-- CONTENIDO -->
    <main class="contenido">

        <h2>Tus tareas</h2>

        <div class="lista">

            <div class="tarea">
                <span>Tabla periódica</span>

                <div class="estado completada">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>


            <div class="tarea">
                <span>Enlaces químicos</span>

                <div class="estado completada">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>


            <div class="tarea">
                <span>Balanceo de ecuaciones</span>

                <div class="estado cancelada">
                    <i class="fa-solid fa-xmark"></i>
                </div>
            </div>


            <!-- TAREA PENDIENTE -->
            <div class="tarea">
                <span>Reacciones químicas</span>

                <a class="estado pendiente" href="31_seccion.html">
                    <i class="fa-regular fa-square"></i>
                </a>
            </div>


            <div class="tarea">
                <span>Estados de la materia</span>

                <div class="estado completada">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>

        </div>


        <!-- AGREGAR NUEVA TAREA -->
        <a class="agregar" href="32_seccion.html">
            <i class="fa-solid fa-circle-plus"></i>
        </a>

    </main>

</div>

</body>
</html>
