<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>EduConnect - Opciones</title>

    <link
        rel="stylesheet"
        href="11_seccion.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

    <main class="telefono">


        <!-- =========================
             ENCABEZADO
        ========================== -->

        <header class="header">


            <!-- VOLVER A LA MATERIA -->

            <a
                class="btn-header"
                href="9_seccion.html"
                title="Volver a Artística">

                <i class="fa-solid fa-arrow-left"></i>

            </a>


            <!-- TÍTULO -->

            <h1>
                Opciones
            </h1>


            <!-- VOLVER AL MENÚ -->

            <a
                class="btn-header"
                href="5_seccion.html"
                title="Volver al menú">

                <i class="fa-solid fa-house"></i>

            </a>

        </header>



        <!-- =========================
             OPCIONES
        ========================== -->

        <main class="menu">


            <!-- =========================
                 CALIFICACIONES
            ========================== -->

            <a
                class="opcion"
                href="13_seccion.html">

                <div class="icono-opcion">

                    <i class="fa-solid fa-clipboard-check"></i>

                </div>

                <div class="texto-opcion">

                    <h2>
                        Revisa tus calificaciones
                    </h2>

                </div>

            </a>



            <!-- =========================
                 TAREAS PENDIENTES
            ========================== -->

            <a
                class="opcion"
                href="12_seccion.html">

                <div class="icono-opcion">

                    <i class="fa-solid fa-calendar-days"></i>

                </div>

                <div class="texto-opcion">

                    <h2>
                        Lista de tareas pendientes
                    </h2>

                </div>

            </a>



            <!-- =========================
                 CHAT CON EL PROFESOR
            ========================== -->

            <a
                class="opcion"
                href="10_seccion.html">

                <div class="icono-opcion">

                    <i class="fa-solid fa-comments"></i>

                </div>

                <div class="texto-opcion">

                    <h2>
                        Chat con el profesor
                    </h2>

                </div>

            </a>


        </main>

    </main>

</body>

</html>
