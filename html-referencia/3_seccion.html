<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recuperar contraseña</title>

    <link rel="stylesheet" href="3_seccion.css">

</head>

<body>

<div class="app">

    <!-- ENCABEZADO -->

    <header class="header">

        <a
            class="back"
            href="2_seccion.html">

            ‹ Back

        </a>

        <h1>
            Olvidaste tu contraseña
        </h1>

    </header>


    <!-- FORMULARIO -->

    <main class="formulario">

        <label for="correo">
            Correo electrónico
        </label>

        <input
            type="email"
            id="correo"
            placeholder="ejemplo@gmail.com"
        >


        <label for="pass1">
            Nueva contraseña
        </label>

        <input
            type="password"
            id="pass1"
            placeholder="********"
        >


        <label for="pass2">
            Confirme la contraseña
        </label>

        <input
            type="password"
            id="pass2"
            placeholder="********"
        >


        <label for="pin">
            Confirme su PIN
        </label>

        <input
            type="password"
            id="pin"
            maxlength="4"
            placeholder="****"
        >


        <button
            class="continuar"
            type="button"
            onclick="actualizarPassword()">

            Continuar

        </button>

    </main>

</div>


<script>

function actualizarPassword() {

    const correo =
        document.getElementById("correo").value.trim();

    const pass1 =
        document.getElementById("pass1").value;

    const pass2 =
        document.getElementById("pass2").value;

    const pin =
        document.getElementById("pin").value;


    if (
        correo === "" ||
        pass1 === "" ||
        pass2 === "" ||
        pin === ""
    ) {

        alert("Completa todos los campos.");

        return;
    }


    if (pass1 !== pass2) {

        alert("Las contraseñas no coinciden.");

        return;
    }


    if (pin.length !== 4) {

        alert("El PIN debe tener 4 números.");

        return;
    }


    const usuario =
        JSON.parse(
            localStorage.getItem("educonnectUsuario")
        );


    if (usuario && usuario.correo !== correo) {

        alert("El correo no coincide con el usuario registrado.");

        return;
    }


    if (usuario) {

        usuario.password = pass1;
        usuario.pin = pin;

        localStorage.setItem(
            "educonnectUsuario",
            JSON.stringify(usuario)
        );

    }


    alert("Contraseña actualizada correctamente.");

    window.location.href = "2_seccion.html";

}

</script>

</body>
</html>
