<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva tarea de Física</title>

    <link rel="stylesheet" href="23_seccion.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="telefono">

    <!-- ENCABEZADO -->
    <header class="header">

        <!-- Volver -->
        <a class="boton" href="21_seccion.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Tareas de Física</h1>

        <!-- Inicio -->
        <a class="boton" href="5_seccion.html">
            <i class="fa-solid fa-house"></i>
        </a>

    </header>


    <!-- CONTENIDO -->
    <main class="contenido">

        <i class="fa-solid fa-book-open icono"></i>

        <h2>Tarea nueva</h2>

        <form id="formulario">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre de la tarea"
                required>

            <input
                type="date"
                id="fecha"
                required>

            <textarea
                id="descripcion"
                placeholder="Descripción de la tarea"
                required></textarea>

            <button type="submit" class="agregar">
                Agregar tarea
            </button>

        </form>

    </main>

</div>


<script>

document.getElementById("formulario").addEventListener("submit", function(e){

    e.preventDefault();

    const nombre = document.getElementById("nombre").value.trim();
    const fecha = document.getElementById("fecha").value;
    const descripcion = document.getElementById("descripcion").value.trim();

    if(nombre === "" || fecha === "" || descripcion === ""){

        alert("Complete todos los campos.");
        return;
    }

    alert(
        "Tarea agregada correctamente.\n\n" +
        "Nombre: " + nombre +
        "\nFecha límite: " + fecha +
        "\nDescripción: " + descripcion
    );

    this.reset();

    window.location.href = "21_seccion.html";

});

</script>

</body>
</html>
