<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nueva tarea de Química</title>

<link rel="stylesheet" href="32_seccion.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="telefono">

    <!-- ENCABEZADO -->
    <header class="header">

        <a class="boton" href="29_seccion.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Tareas de Química</h1>

        <a class="boton" href="5_seccion.html">
            <i class="fa-solid fa-house"></i>
        </a>

    </header>


    <!-- CONTENIDO -->
    <main class="contenido">

        <div class="icono">
            <i class="fa-solid fa-flask"></i>
        </div>

        <h2>Nueva tarea</h2>

        <form id="formulario">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre de la tarea"
                required>

            <input
                type="date"
                id="fecha"
                required>

            <textarea
                id="descripcion"
                placeholder="Descripción de la tarea"
                required></textarea>

            <button type="submit">
                Agregar tarea
            </button>

        </form>

    </main>

</div>


<script>

document.getElementById("formulario").addEventListener("submit", function(e){

    e.preventDefault();

    let nombre = document.getElementById("nombre").value;
    let fecha = document.getElementById("fecha").value;
    let descripcion = document.getElementById("descripcion").value;

    if(nombre === "" || fecha === "" || descripcion === ""){
        alert("Complete todos los campos.");
        return;
    }

    alert(
        "Tarea agregada correctamente.\n\n" +
        "Nombre: " + nombre +
        "\nFecha límite: " + fecha +
        "\nDescripción: " + descripcion
    );

    this.reset();

});

</script>

</body>
</html>
