<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tareas de Física</title>

    <link rel="stylesheet" href="21_seccion.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="telefono">

    <!-- ENCABEZADO -->
    <header class="header">

        <!-- Volver -->
        <a class="boton" href="19_seccion.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Tareas de Física</h1>

        <!-- Inicio -->
        <a class="boton" href="5_seccion.html">
            <i class="fa-solid fa-house"></i>
        </a>

    </header>


    <!-- CONTENIDO -->
    <main class="contenido">

        <h2>Tus tareas</h2>

        <div class="lista">

            <div class="tarea">
                <span>Leyes de Newton</span>

                <button class="estado verde">
                    <i class="fa-solid fa-check"></i>
                </button>
            </div>


            <div class="tarea">
                <span>Movimiento rectilíneo</span>

                <button class="estado verde">
                    <i class="fa-solid fa-check"></i>
                </button>
            </div>


            <div class="tarea">
                <span>Fuerza y aceleración</span>

                <button class="estado rojo">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>


            <div class="tarea">
                <span>Caída libre</span>

                <a class="estado gris" href="24_seccion.html">
                    <i class="fa-regular fa-square"></i>
                </a>
            </div>


            <div class="tarea">
                <span>Energía cinética</span>

                <button class="estado verde">
                    <i class="fa-solid fa-check"></i>
                </button>
            </div>

        </div>


        <!-- AGREGAR NUEVA TAREA -->
        <a class="agregar" href="23_seccion.html">
            <i class="fa-solid fa-circle-plus"></i>
        </a>

    </main>

</div>

</body>
</html>
