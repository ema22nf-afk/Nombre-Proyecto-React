<!DOCTYPE html>

<head>

<title>Matemáticas</title>

<link rel="stylesheet" href="36_seccion.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="telefono">

    <!-- ENCABEZADO -->
    <header class="header">

        <a class="boton" href="5_seccion.html">
            <i class="fa-solid fa-house"></i>
        </a>

        <div class="buscador">
            <input type="text" id="buscar" placeholder="Matemáticas">

            <button onclick="buscarMateria()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

    </header>


    <!-- CONTENIDO -->
    <main class="contenido">

        <div class="imagen">

        <div class="informacion">
            <p><strong>Profesor:</strong> Juan Pérez</p>
        </div>

        <div class="informacion">
            <p><strong>Código:</strong> MAT-101</p>
        </div>

        <a class="entrar" href="37_seccion.html">
            Entrar a la materia
        </a>

    </main>

</div>


<script>

function buscarMateria(){

    let materia = document.getElementById("buscar").value;

    if(materia.trim() === ""){
        alert("Escribe una materia.");
    }else{
        alert("Buscando: " + materia);
    }

}

</script>
