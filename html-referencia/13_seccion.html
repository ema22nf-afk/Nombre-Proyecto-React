<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>EduConnect - Calificaciones</title>

    <link
        rel="stylesheet"
        href="13_seccion.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

<div class="telefono">


    <!-- =================================
         ENCABEZADO
    ================================== -->

    <header class="header">


        <!-- VOLVER -->

        <a
            class="btn-header"
            href="11_seccion.html"
            title="Volver a opciones">

            <i class="fa-solid fa-arrow-left"></i>

        </a>


        <!-- TÍTULO -->

        <h1>
            Calificaciones
        </h1>


        <!-- INICIO -->

        <a
            class="btn-header"
            href="5_seccion.html"
            title="Volver al inicio">

            <i class="fa-solid fa-house"></i>

        </a>

    </header>



    <!-- =================================
         CONTENIDO
    ================================== -->

    <main class="contenido">


        <h2>
            Artística
        </h2>


        <!-- PROMEDIO -->

        <div class="promedio">

            <p>
                Promedio
            </p>

            <span id="promedio">
                4.2
            </span>

        </div>



        <!-- =================================
             LISTA DE CALIFICACIONES
        ================================== -->

        <div class="lista">


            <!-- TAREA 1 -->

            <div class="calificacion">

                <div class="informacion">

                    <h3>
                        Colorear dibujo
                    </h3>

                    <p>
                        Calificación
                    </p>

                </div>

                <div class="nota">
                    4.5
                </div>

            </div>



            <!-- TAREA 2 -->

            <div class="calificacion">

                <div class="informacion">

                    <h3>
                        Delineado
                    </h3>

                    <p>
                        Calificación
                    </p>

                </div>

                <div class="nota">
                    4.0
                </div>

            </div>



            <!-- TAREA 3 -->

            <div class="calificacion">

                <div class="informacion">

                    <h3>
                        Sombras
                    </h3>

                    <p>
                        Calificación
                    </p>

                </div>

                <div class="nota">
                    3.8
                </div>

            </div>



            <!-- TAREA 4 -->

            <div class="calificacion">

                <div class="informacion">

                    <h3>
                        Biografía
                    </h3>

                    <p>
                        Calificación
                    </p>

                </div>

                <div class="nota">
                    4.5
                </div>

            </div>



            <!-- TAREA 5 -->

            <div class="calificacion">

                <div class="informacion">

                    <h3>
                        Paisaje
                    </h3>

                    <p>
                        Pendiente de calificar
                    </p>

                </div>

                <div class="pendiente">
                    -
                </div>

            </div>

        </div>



        <!-- MENSAJE -->

        <div class="mensaje">

            <i class="fa-solid fa-circle-info"></i>

            <span>
                Las calificaciones son asignadas por el profesor.
            </span>

        </div>


    </main>

</div>

</body>

</html>
