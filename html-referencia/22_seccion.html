<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat Física</title>

    <link rel="stylesheet" href="22_seccion.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="telefono">

    <!-- ENCABEZADO -->
    <header class="header">

        <!-- Volver -->
        <a class="boton" href="19_seccion.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Chat Física</h1>

        <!-- Inicio -->
        <a class="boton" href="5_seccion.html">
            <i class="fa-solid fa-house"></i>
        </a>

    </header>


    <!-- CONVERSACIÓN -->
    <main class="chat" id="chat">

        <div class="mensaje enviado">
            Hola profesor, tengo una duda sobre la actividad de Física.
        </div>

        <div class="mensaje recibido">
            Claro, dime cuál es tu duda y con gusto te ayudo.
        </div>

        <div class="mensaje enviado">
            ¿Cómo debo realizar el ejercicio sobre caída libre?
        </div>

        <div class="mensaje recibido">
            Debes aplicar las fórmulas vistas en clase y mostrar el procedimiento completo.
        </div>

    </main>


    <!-- BARRA PARA ENVIAR MENSAJES -->
    <footer class="footer">

        <button class="icono" type="button">
            <i class="fa-solid fa-camera"></i>
        </button>

        <button class="icono" type="button">
            <i class="fa-regular fa-image"></i>
        </button>

        <button class="icono" type="button">
            <i class="fa-solid fa-microphone"></i>
        </button>

        <input
            type="text"
            id="mensajeInput"
            placeholder="Escribe un mensaje...">

        <button class="enviar" type="button" onclick="enviarMensaje()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </footer>

</div>


<script>

function enviarMensaje(){

    const input = document.getElementById("mensajeInput");
    const chat = document.getElementById("chat");

    const texto = input.value.trim();

    if(texto !== ""){

        const mensaje = document.createElement("div");

        mensaje.classList.add("mensaje", "enviado");

        mensaje.textContent = texto;

        chat.appendChild(mensaje);

        input.value = "";

        chat.scrollTop = chat.scrollHeight;

    }

}


/* Permite enviar también con Enter */

document
.getElementById("mensajeInput")
.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        enviarMensaje();

    }

});

</script>

</body>
</html>
