<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificar Actividad - Laura Martínez</title>
    <link rel="stylesheet" href="75_seccion.css">
</head>

<body>

<div class="telefono">

    <header>
        <a href="74_seccion.html" class="btn-regresar">←</a>
        <h1>Calificar actividad</h1>
    </header>

    <main>

        <section class="perfil">
            <div class="avatar">👩‍🎓</div>

            <div>
                <h2>Laura Martínez</h2>
                <p>Grado 9° · Tecnología</p>
            </div>
        </section>

        <div class="actividad">

            <h2>Actividad 2</h2>

            <p class="titulo">
                Investigación sobre tecnología
            </p>

            <p class="descripcion">
                Realiza una investigación sobre la importancia
                de la tecnología en la vida cotidiana.
            </p>

            <div class="archivo">
                📎 Investigación_tecnologia.pdf
            </div>

        </div>

        <div class="formulario">

            <label for="nota">Calificación</label>

            <input
                type="number"
                id="nota"
                min="0"
                max="5"
                step="0.1"
                placeholder="Ejemplo: 4.5"
            >

            <label for="comentario">
                Comentario del profesor
            </label>

            <textarea
                id="comentario"
                placeholder="Escribe un comentario sobre el trabajo..."
            ></textarea>

            <button onclick="guardarCalificacion()">
                Guardar calificación
            </button>

            <p id="mensaje"></p>

        </div>

    </main>

</div>


<script>

function guardarCalificacion() {

    const nota = document.getElementById("nota").value;
    const comentario = document.getElementById("comentario").value.trim();
    const mensaje = document.getElementById("mensaje");

    if (nota === "") {
        mensaje.textContent = "⚠️ Ingresa una calificación.";
        mensaje.className = "error";
        return;
    }

    if (nota < 0 || nota > 5) {
        mensaje.textContent =
            "⚠️ La calificación debe estar entre 0 y 5.";
        mensaje.className = "error";
        return;
    }

    if (comentario === "") {
        mensaje.textContent =
            "⚠️ Escribe un comentario.";
        mensaje.className = "error";
        return;
    }

    const datos = {
        nota: parseFloat(nota),
        comentario: comentario
    };

    localStorage.setItem(
        "calificacion_laura_actividad2",
        JSON.stringify(datos)
    );

    mensaje.textContent =
        "✓ Calificación guardada correctamente.";

    mensaje.className = "exito";

    setTimeout(function() {
        window.location.href = "74_seccion.html";
    }, 1000);
}

</script>

</body>
</html>
