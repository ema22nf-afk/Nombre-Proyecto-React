<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tareas de Física</title>

    <link rel="stylesheet" href="26_seccion.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="telefono">

    <!-- ENCABEZADO -->
    <header class="header">

        <a class="boton" href="24_seccion.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Tareas de Física</h1>

        <a class="boton" href="5_seccion.html">
            <i class="fa-solid fa-house"></i>
        </a>

    </header>

    <!-- CONTENIDO -->
    <main class="contenido">

        <h2>Tus tareas</h2>

        <div class="lista">

            <div class="tarea">
                <span>Leyes de Newton</span>

                <div class="estado completada">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>

            <div class="tarea">
                <span>Movimiento rectilíneo</span>

                <div class="estado completada">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>

            <div class="tarea">
                <span>Fuerza y aceleración</span>

                <div class="estado cancelada">
                    <i class="fa-solid fa-xmark"></i>
                </div>
            </div>

            <!-- CAÍDA LIBRE NO REALIZADA -->
            <div class="tarea">
                <span>Caída libre</span>

                <div class="estado cancelada">
                    <i class="fa-solid fa-xmark"></i>
                </div>
            </div>

            <div class="tarea">
                <span>Energía cinética</span>

                <div class="estado completada">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>

        </div>

        <!-- AGREGAR NUEVA TAREA -->
        <a class="agregar" href="23_seccion.html">
            <i class="fa-solid fa-circle-plus"></i>
        </a>

    </main>

</div>

</body>
</html>
