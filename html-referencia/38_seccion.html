<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tareas de Matemáticas</title>

<link rel="stylesheet" href="38_seccion.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="telefono">

    <!-- ENCABEZADO -->
    <header class="header">

        <a class="boton" href="37_seccion.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Tareas Matemáticas</h1>

        <a class="boton" href="5_seccion.html">
            <i class="fa-solid fa-house"></i>
        </a>

    </header>


    <!-- CONTENIDO -->
    <main class="contenido">

        <h2>Tus tareas</h2>

        <div class="lista">

            <div class="tarea">

                <span>Operaciones con fracciones</span>

                <button class="estado completada">
                    <i class="fa-solid fa-check"></i>
                </button>

            </div>


            <div class="tarea">

                <span>Ecuaciones lineales</span>

                <button class="estado completada">
                    <i class="fa-solid fa-check"></i>
                </button>

            </div>


            <div class="tarea">

                <span>Funciones matemáticas</span>

                <button class="estado cancelada">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>


            <!-- TAREA PENDIENTE -->
            <div class="tarea">

                <span>Resolver problemas</span>

                <a class="estado pendiente" href="40_seccion.html">
                    <i class="fa-regular fa-square"></i>
                </a>

            </div>


            <div class="tarea">

                <span>Geometría</span>

                <button class="estado completada">
                    <i class="fa-solid fa-check"></i>
                </button>

            </div>

        </div>


        <!-- AGREGAR NUEVA TAREA -->
        <a class="agregar" href="41_seccion.html">
            <i class="fa-solid fa-circle-plus"></i>
        </a>

    </main>

</div>

</body>
</html>
