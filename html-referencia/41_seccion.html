<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nueva tarea de Matemáticas</title>

<link rel="stylesheet" href="41_seccion.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="telefono">

    <!-- ENCABEZADO -->
    <header class="header">

        <a class="boton" href="38_seccion.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Nueva tarea</h1>

        <a class="boton" href="5_seccion.html">
            <i class="fa-solid fa-house"></i>
        </a>

    </header>

    <!-- CONTENIDO -->
    <main class="contenido">

        <div class="imagen">
            <i class="fa-solid fa-square-root-variable"></i>
        </div>

        <h2>Agregar tarea</h2>

        <form id="formulario">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre de la tarea"
                required>

            <input
                type="date"
                id="fecha"
                required>

            <textarea
                id="descripcion"
                placeholder="Descripción de la tarea"
                required></textarea>

            <button type="submit" class="agregar">
                <i class="fa-solid fa-plus"></i>
                Agregar tarea
            </button>

        </form>

    </main>

</div>

<script>

document.getElementById("formulario").addEventListener("submit", function(event){

    event.preventDefault();

    let nombre = document.getElementById("nombre").value.trim();
    let fecha = document.getElementById("fecha").value;
    let descripcion = document.getElementById("descripcion").value.trim();

    if(nombre === "" || fecha === "" || descripcion === ""){
        alert("Por favor, completa todos los campos.");
        return;
    }

    alert("Tarea agregada correctamente.");

    this.reset();

});

</script>

</body>
</html>
