<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tareas de Química</title>

<link rel="stylesheet" href="34_seccion.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="telefono">

    <!-- ENCABEZADO -->
    <header class="header">

        <a class="boton" href="31_seccion.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Tareas de Química</h1>

        <a class="boton" href="5_seccion.html">
            <i class="fa-solid fa-house"></i>
        </a>

    </header>


    <!-- CONTENIDO -->
    <main class="contenido">

        <h2>Tus tareas</h2>

        <div class="lista">

            <div class="tarea">
                <span>Tabla periódica</span>

                <div class="estado completada">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>


            <div class="tarea">
                <span>Enlaces químicos</span>

                <div class="estado completada">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>


            <div class="tarea">
                <span>Balanceo de ecuaciones</span>

                <div class="estado cancelada">
                    <i class="fa-solid fa-xmark"></i>
                </div>
            </div>


            <!-- REACCIONES QUÍMICAS NO REALIZADA -->
            <div class="tarea">
                <span>Reacciones químicas</span>

                <div class="estado cancelada">
                    <i class="fa-solid fa-xmark"></i>
                </div>
            </div>


            <div class="tarea">
                <span>Estados de la materia</span>

                <div class="estado completada">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>

        </div>

    </main>

</div>

</body>
</html>
