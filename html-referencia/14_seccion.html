<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>EduConnect - Tarea</title>

    <link
        rel="stylesheet"
        href="14_seccion.css">

</head>


<body>

<div class="telefono">


    <!-- =========================
         ENCABEZADO
    ========================== -->

    <header class="header">

        <!-- VOLVER A TAREAS -->

        <a
            class="btn-header"
            href="12_seccion.html"
            title="Volver a tareas">

            <i>←</i>

        </a>


        <!-- TÍTULO -->

        <h1>
            Tareas
        </h1>


        <!-- INICIO -->

        <a
            class="btn-header"
            href="5_seccion.html"
            title="Volver al inicio">

            <i>⌂</i>

        </a>

    </header>



    <!-- =========================
         CONTENIDO
    ========================== -->

    <main class="contenido">


        <h2>
            Paisaje
        </h2>


        <!-- FECHA -->

        <div class="fecha">

            <strong>
                Fecha límite:
            </strong>

            <span>
                16/09/2025
            </span>

        </div>


        <!-- IMAGEN -->

        <img
            src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600"
            alt="Paisaje"
            class="imagen">


        <!-- DESCRIPCIÓN -->

        <div class="descripcion">

            <h3>
                Descripción
            </h3>

            <p>
                Realiza el dibujo con base en la muestra
                y aplica colores cálidos con delineado
                y degradado.
            </p>

        </div>


        <!-- =========================
             BOTONES
        ========================== -->

        <div class="botones">


            <!-- ENTREGAR -->

            <a
                class="aceptar"
                href="15_seccion.html"
                title="Entregar tarea">

                ✓

            </a>


            <!-- NO ENTREGAR -->

            <a
                class="cancelar"
                href="16_seccion.html"
                title="No entregar tarea">

                ✕

            </a>


        </div>


        <p class="ayuda">
            Selecciona una opción para continuar
        </p>


    </main>

</div>


</body>

</html>
